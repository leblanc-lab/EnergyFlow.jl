name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "CITATION.cff"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "CITATION.cff"

# Supersede in-flight runs when a PR is pushed to again; keep main runs intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["lts", "1", "pre"]
        include:
          - julia-version: "pre"
            allow-failure: true
          - julia-version: "lts"
            allow-failure: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix['allow-failure'] || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        env:
          # Run multithreaded so paper-mode / parallel network-simplex paths run in tests
          JULIA_NUM_THREADS: "2"
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Process coverage
        if: matrix.julia-version == '1'
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage to Codecov
        if: matrix.julia-version == '1'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  precompile-thread-safety:
    name: 1-thread-precompile → multi-thread-run (julia ${{ matrix.julia-version }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["lts", "1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Precompile with a single thread
        env:
          JULIA_NUM_THREADS: "1"
        run: julia --project=. -e 'using Pkg; Pkg.precompile(); using EnergyFlow'

      - name: Run tests with multiple threads (reusing the 1-thread cache)
        env:
          JULIA_NUM_THREADS: "4"
        run: julia --project=. test/runtests.jl
