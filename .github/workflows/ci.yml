name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia-version: ["lts", "1", "pre"]
        include:
          - julia-version: "pre"
            allow-failure: true
          - julia-version: "lts"
            allow-failure: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix['allow-failure'] || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        env:
          # Run multithreaded so paper-mode / parallel network-simplex paths run in tests
          JULIA_NUM_THREADS: "2"
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Process coverage
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Locks in ROADMAP Task 0.2: precompilation is re-enabled, and precompiling
  # with ONE thread must not break the threaded code (pairwise @threads, parallel
  # @spawn cost-fill, paper-mode worker pool) when later run with MANY threads.
  # The two steps use identical compile flags and the default project, so the
  # multi-thread run reuses the 1-thread precompile cache instead of rebuilding it.
  precompile-thread-safety:
    name: 1-thread-precompile → multi-thread-run (julia ${{ matrix.julia-version }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["lts", "1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Precompile with a single thread
        env:
          JULIA_NUM_THREADS: "1"
        run: julia --project=. -e 'using Pkg; Pkg.precompile(); using EnergyFlow'

      - name: Run tests with multiple threads (reusing the 1-thread cache)
        env:
          JULIA_NUM_THREADS: "4"
        # Driven via runtests.jl (not Pkg.test) so this step reuses the cache
        # built above rather than recompiling under Pkg.test's own flags.
        run: julia --project=. test/runtests.jl
